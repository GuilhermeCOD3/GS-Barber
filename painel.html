<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | GS Barber</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/painel.css">
</head>
<body>
    <main class="container py-5">
        <section class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card-panel p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <img src="assets/img/icons/WhatsApp Image 2026-07-17 at 18.20.46.jpeg" alt="Logo GS Barber" class="img-fluid rounded-circle mb-3" style="width: 84px; height: 84px; object-fit: cover; border: 1px solid rgba(212, 175, 55, 0.35);">
                        <p class="eyebrow">Painel do barbeiro</p>
                        <h1 class="h2 fw-bold">GS Barber</h1>
                        <p class="text-muted">Acesse os agendamentos e organize o dia com uma agenda visual.</p>
                    </div>

                    <form id="form-login" class="mb-4">
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuário</label>
                            <input type="text" id="usuario" class="form-control" placeholder="Digite o usuário" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" class="form-control" placeholder="Digite a senha" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Entrar</button>
                    </form>

                    <div id="mensagem-login" class="alert d-none" role="alert"></div>

                    <section id="area-painel" class="d-none">
                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <h2 class="h4 mb-0">Agenda do barbeiro</h2>
                            <div class="d-flex gap-2">
                                <button id="botao-sair" class="btn btn-outline-gold btn-sm">Sair</button>
                                <a href="index.html" class="btn btn-outline-gold btn-sm">Voltar</a>
                            </div>
                        </div>

                        <div id="agenda-painel" class="agenda-grid mb-4"></div>

                        <div class="mt-4">
                            <h3 class="h5 mb-3">Próximos atendimentos</h3>
                            <div id="lista-painel" class="list-group"></div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div id="modal-editar" class="modal-editar d-none" role="dialog" aria-modal="true" aria-labelledby="modal-editar-titulo">
        <div class="modal-editar-dialog">
            <div class="modal-editar-header">
                <h3 id="modal-editar-titulo" class="h5 mb-0">Editar agendamento</h3>
                <button type="button" class="btn-close btn-close-white" id="botao-fechar-modal" aria-label="Fechar"></button>
            </div>
            <form id="form-editar-agendamento" class="mt-3">
                <input type="hidden" id="editar-id">
                <div class="mb-3">
                    <label for="editar-nome" class="form-label">Nome</label>
                    <input type="text" id="editar-nome" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="editar-telefone" class="form-label">Telefone</label>
                    <input type="tel" id="editar-telefone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="editar-servico" class="form-label">Serviço</label>
                    <select id="editar-servico" class="form-select" required>
                        <option value="Corte">Corte</option>
                        <option value="Barba">Barba</option>
                        <option value="Corte + Barba">Corte + Barba</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="editar-data" class="form-label">Data</label>
                    <input type="date" id="editar-data" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="editar-horario" class="form-label">Horário</label>
                    <input type="time" id="editar-horario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="editar-observacoes" class="form-label">Observações</label>
                    <textarea id="editar-observacoes" class="form-control" rows="3"></textarea>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-gold">Salvar</button>
                    <button type="button" class="btn btn-outline-gold" id="botao-cancelar-edicao">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase/firebase-config.js"></script>
    <script src="assets/js/painel.js"></script>
</body>
</html>
